name: Fuzz nightly

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  honggfuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libunwind-dev binutils-dev liblzma-dev libbfd-dev

      - name: Install the C3 compiler
        run: |
          curl -sL -o /tmp/c3-linux.tar.gz https://github.com/c3lang/c3c/releases/download/v0.8.6/c3-linux.tar.gz
          mkdir -p /tmp/c3
          tar -xzf /tmp/c3-linux.tar.gz -C /tmp/c3
          echo "/tmp/c3/c3" >> "$GITHUB_PATH"

      - name: Show versions
        run: |
          c3c --version
          honggfuzz --version || true
          cat /proc/sys/kernel/perf_event_paranoid

      - name: Run honggfuzz session (coverage-guided)
        timeout-minutes: 30
        run: make fuzz-hf-cov HF_N=1000000 HF_TIMEOUT=600

      - name: Upload new coverage and crashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf-output
          path: |
            out/hf_new
            *.fuzz
          if-no-files-found: ignore
